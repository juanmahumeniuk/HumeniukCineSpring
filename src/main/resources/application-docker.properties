# Perfil activado con SPRING_PROFILES_ACTIVE=docker (docker compose)
spring.datasource.url=jdbc:mysql://mysql:3306/db_cine?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
# Usuario y contraseña: SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD (desde .env)

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.data.web.page-serialization-mode=VIA_DTO

# Hibernate Envers
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_entity=com.example.HumeniukCineSpring.entities.audit.AuditRevision

server.port=9000

app.seed.enabled=true
