#spring.datasource.url=jdbc:mysql://localhost:3306/db_persona?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/db_cine?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=jota
spring.datasource.password=password123

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate Envers (tabla REVINFO + columnas rev/revtype en *_aud)
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_entity=com.example.HumeniukCineSpring.entities.audit.AuditRevision
#Variable de entorno
server.port=9000

# Seed automático al iniciar (solo si pelicula está vacía)
app.seed.enabled=true